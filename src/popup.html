<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header>
      <div class="brand">
        <h1>Date Naturalizer</h1>
        <div class="local" id="local">—</div>
      </div>
      <div class="host" id="host">—</div>
    </header>

    <section class="toggles">
      <label class="row">
        <span>Enabled on this site</span>
        <input type="checkbox" id="site-toggle" />
      </label>
      <label class="row">
        <span>Enabled everywhere</span>
        <input type="checkbox" id="global-toggle" />
      </label>
      <label class="row">
        <span>Convert relative dates</span>
        <input type="checkbox" id="relatives-toggle" />
      </label>
      <p class="hint">
        Resolves <em>yesterday</em>, <em>5 days ago</em>, etc. against the
        article's publication date. Heuristic — can be inaccurate, especially
        on pages without a clear publish time.
      </p>
    </section>

    <section class="tzs">
      <div class="label">
        <span>Extra timezones</span>
        <span class="label-count" id="tz-count"></span>
      </div>
      <div class="chips" id="chips"></div>
      <div class="add">
        <span class="add-prefix" aria-hidden="true">+</span>
        <input
          id="tz-input"
          list="tz-list"
          placeholder="Add a timezone…"
          autocomplete="off"
          spellcheck="false"
        />
        <datalist id="tz-list"></datalist>
      </div>
    </section>

    <script src="popup.js"></script>
  </body>
</html>
