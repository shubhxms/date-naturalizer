<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header>
      <h1>Date Naturalizer</h1>
      <div class="host" id="host">—</div>
    </header>

    <section class="toggles">
      <label class="row">
        <span>Enabled on this site</span>
        <input type="checkbox" id="site-toggle" />
      </label>
      <label class="row">
        <span>Enabled everywhere</span>
        <input type="checkbox" id="global-toggle" />
      </label>
    </section>

    <section class="tzs">
      <div class="label">Extra timezones</div>
      <div class="chips" id="chips"></div>
      <div class="add">
        <input
          id="tz-input"
          list="tz-list"
          placeholder="Add a timezone…"
          autocomplete="off"
          spellcheck="false"
        />
        <datalist id="tz-list"></datalist>
      </div>
    </section>

    <script src="popup.js"></script>
  </body>
</html>
